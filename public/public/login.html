<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập - Quản lý chi tiêu</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#1d4ed8,#0f172a);font-family:system-ui,Segoe UI,Arial;color:#172033}.box{width:min(420px,92vw);background:white;border-radius:20px;padding:30px;box-shadow:0 20px 60px #0004;text-align:center}.icon{font-size:48px}.box h1{margin:8px 0;font-size:24px}.box p{color:#6b7280;font-size:14px;margin:0 0 22px}input{width:100%;padding:13px;border:1px solid #d5dbe5;border-radius:10px;font-size:16px;outline:0}button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:#2563eb;color:white;font-size:16px;font-weight:800;cursor:pointer}.error{color:#dc2626;font-size:13px;margin-top:10px;min-height:20px}</style></head><body><div class="box"><div class="icon">🔐</div><h1>Quản Lý Chi Tiêu Gia Đình</h1><p>Nhập mật khẩu để vào trang quản lý.</p><form id="f"><input id="p" type="password" placeholder="Nhập mật khẩu" autofocus required><button>Đăng nhập</button><div id="e" class="error"></div></form></div><script>
f.onsubmit=async e=>{e.preventDefault();e.textContent="";try{let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p.value})});let j=await r.json();if(!r.ok)throw Error(j.error||"Mật khẩu không đúng");sessionStorage.setItem("familyToken",j.token);location.href="/"}catch(x){document.getElementById("e").textContent=x.message}}
</script></body></html>
